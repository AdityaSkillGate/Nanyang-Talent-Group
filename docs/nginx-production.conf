server {
    listen 80;
    listen [::]:80;
    server_name nytalent.com.sg www.nytalent.com.sg;
    return 301 https://nytalent.com.sg$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nytalent.com.sg;

    ssl_certificate /etc/letsencrypt/live/nytalent.com.sg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nytalent.com.sg/privkey.pem;

    return 301 https://nytalent.com.sg$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nytalent.com.sg;

    root /var/www/nytalent.com.sg/out;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/nytalent.com.sg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nytalent.com.sg/privkey.pem;

    # Clean URLs and 404 fallback
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Static Asset Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
